# 一加平板 Pro 性能调度模块 - 配置文件
# 改完后重启平板生效，或在 root shell 里手动跑一次：
#   su -c "sh /data/adb/modules/oneplus_pad_pro_sched/sched/apply_sched.sh"
#
# 约定：-1 / 空 = 不碰该项（保持原厂值）。这是最安全的默认值。
# 频率上下限默认不锁，只调响应速度（rate limit）和分组，厂商的
# 潮汐架构 / Power HAL 仍在工作，不会和它正面抢。

# 模式：balanced | performance | powersave
# 游戏模式是临时的，不存进 MODE：进游戏自动切、退游戏自动切回 MODE。
MODE=balanced

# 调频器：留空 = 保持原厂（一般已是 schedutil）。不要改成 performance，
# 那会锁最高频，又热又耗电。
GOVERNOR=schedutil

# schedutil 响应速度（微秒）。只在对应节点存在时才写。
# balanced: 升频快一点，降频别太急；performance: 升频更快、降频更慢；
# powersave: 升频慢、降频快。
SCHEDUTIL_UP_RATE_LIMIT_US=500
SCHEDUTIL_DOWN_RATE_LIMIT_US=10000
SCHEDUTIL_IOWAIT_BOOST=1

# uclamp（0-1024，-1=不碰）。只在 /dev/cpuctl 下对应节点存在时才写。
# 0.4.38：max 永不写，top-app min 永不写——这台内核的 max 只认字面量
# 'max'，数字写不进去；top-app min=153 也被拒（0.4.37 真机诊断）。
# 只留 foreground min（游戏 77 / 性能 51 / 日常 0）。下面两个 max 键
# 还留着备查，默认值 -1；performance 才给前台一个很小的下限兜底，
# balanced / powersave 默认不碰。
TOP_APP_UCLAMP_MIN=-1
TOP_APP_UCLAMP_MAX=-1
FOREGROUND_UCLAMP_MIN=-1
FOREGROUND_UCLAMP_MAX=-1
BACKGROUND_UCLAMP_MIN=-1
BACKGROUND_UCLAMP_MAX=-1

# 内核调度参数：默认不碰（SCHED_TUNABLES=0）。
# 只有你明确改成 1，才写下面这几项，且节点不存在就跳过。
SCHED_TUNABLES=0
SCHED_MIGRATION_COST_NS=500000
SCHED_MIN_GRANULARITY_NS=1000000
SCHED_WAKEUP_GRANULARITY_NS=2000000
SCHED_LATENCY_NS=12000000

# GPU：默认不锁频率、不改 governor，只记录现状。
# GPU_MIN_FREQ_PCT=0 表示不碰；改成例如 30，会按 max_freq 的 30%
# 去设 min_freq（仍以实际 OPP 为准，写不进去就跳过）。
GPU_MIN_FREQ_PCT=0

# I/O：默认不改调度器。IO_SCHEDULER 留空=不碰；
# 想试可填 mq-deadline 或 bfq，但只有该调度器已在列表里才生效。
IO_SCHEDULER=
READ_AHEAD_KB=-1

# cpuset 分组：注意，CPUSET_* 只在 balanced（均衡档）生效。
# performance / powersave / game 三档的 cpuset 是写死在 apply_sched.sh
# 里的（改这里对那三档没反应）：
#   performance：top-app 全核，foreground 全核；
#   game：top-app 全核，foreground 中+大核；
#   powersave：top-app 中+大核，foreground 中+小核。
#   background / system-background / restricted 三档也各有写死的值。
#   均衡档的策略名由脚本按 cpu_capacity 实时算出核号，这里只定策略名，
#   不写 0-7 这种死数字。top-app 永远不被饿死。
CPUSET_TOP_APP=all
CPUSET_FOREGROUND=big
CPUSET_BACKGROUND=little
CPUSET_SYSTEM_BACKGROUND=mid_little
CPUSET_RESTRICTED=little

# --- 线程模块自动识别（thread.sh auto / watch 用）---
# AUTO_WATCH_INTERVAL：watch 轮询间隔秒数，2-60，默认 5。
#   dumpsys 识别比较重，watch 默认走 cpuset/oom 快路，只有快路
#   找不到时才调 dumpsys，所以 5 秒一轮一般不明显耗电。
AUTO_WATCH_INTERVAL=5
# AUTO_WATCH_ON_BOOT：1=开机由 service.sh 在后台启动 watch（默认，0.4.3 起）。
#   想让它全自动跟，就保持 1；改 0 则开机不启动，需手动开 watch。
AUTO_WATCH_ON_BOOT=1
# --- 自动模式（0.4.7，watch 在非游戏时按屏幕/电量自动选基础模式）---
# AUTO_MODE：1=开（默认），0=关。开的时候，watch 每轮在非游戏前台
#   时按规则自动切基础模式，不用手动点；关的时候 watch 永远不动模式，
#   只绑核、只切游戏档，和 0.4.6 之前一样。
#   规则（按优先级）：游戏前台 → 不动（游戏档自己管）；屏幕灭 →
#   powersave；电量 <= AUTO_MODE_LOW_BATTERY_PCT 且正在放电 →
#   powersave；否则 → 下面 MODE 的值。自动模式永远不切 performance，
#   只在 powersave 和 MODE 之间切。
AUTO_MODE=1
# AUTO_MODE_LOW_BATTERY_PCT：低电量阈值（百分比，5-50，默认 20）。
#   电量 <= 这个值且正在放电（没插充电器）时自动切 powersave；插着
#   充电器、或电量高于这个值时不触发。
AUTO_MODE_LOW_BATTERY_PCT=20
# AUTO_MODE_DEBUG：1=开调试日志（默认 0 关）。开的时候，watch 每分钟
#   最多记一行 `INFO auto-mode check screen=... battery=... target=...
#   applied=...`，即使模式没变也记——用来诊断“watch 在跑但 auto-mode
#   一声不吭”是为什么。正常用保持 0，日志干净。
#   用法：panel.sh set AUTO_MODE_DEBUG 1，重启 watch（或等下一轮），
#   看日志；查完再设回 0。
AUTO_MODE_DEBUG=0
# AUTO_MODE_WAKELOCK：1=watch 持部分唤醒锁（默认 0 关）。
#   背景：灭屏后系统休眠（doze）会把 watch 冻住，它跑不起来就检测
#   不到 screen-off，0.4.7 因此一次都没触发过。持锁能让 watch 在灭屏
#   时继续跑、可靠地切省电，但代价是设备无法深度休眠、耗电上升——
#   省电模式省的那点电可能还抵不上持锁的消耗。所以默认关，只有确实
#   需要“灭屏必切省电”才手动开 1。开 1 后 watch 退出 / thread.sh stop
#   时会自动放锁；万一 watch 被强杀没放锁，跑一次 thread.sh stop 或
#   重启平板即可清掉。
AUTO_MODE_WAKELOCK=0
# --- 日志上限（0.4.12）---
# LOG_MAX_BYTES：日志文件到这个字节数就轮转（默认 1048576 = 1MB）。
#   轮转时只保留最后 LOG_KEEP_LINES 行（默认 4000 行，约等于一夜
#   的取证量），并在文件末尾记一行 `INFO log rotated`。改 0 = 不限
#   （不推荐：0.4.11 的日志 3 天就长到 1.9MB / 27821 行）。
#   面板里的“清空日志”按钮仍可随时手动清零。
LOG_MAX_BYTES=1048576
LOG_KEEP_LINES=4000
# 两款主力游戏的包名（已核实，见 README）：
#   和平精英 com.tencent.tmgp.pubgmhd（UE4；com.tencent.tmgp.sgame 是同款另一渠道包名）
#   无畏契约：源能行动 com.tencent.tmgp.codev（手游，Lightspeed / Riot）
# 包名里含下面任一子串就按游戏档绑。没命中也不用怕：线程名里有
# Unity/Unreal/Vulkan/Game 也会判成通用 game。
PEACE_PACKAGES="com.tencent.tmgp.pubgmhd com.tencent.tmgp.sgame pubgmhd pubgm sgame gameforpeace"
VALORANT_PACKAGES="com.tencent.tmgp.codev codev valorant playvalorant"
AUTO_GAME_PACKAGES="tmgp.sgame miHoYo HoYoverse unity unreal genshin honkai starrail pubg peace elite wuthering zzz $PEACE_PACKAGES $VALORANT_PACKAGES"
# AUTO_CRITICAL_NICE：0=不调 nice（默认）；改成 -5 会把主线程 nice 调到 -5，
#   更优先但更激进，一般没必要开。游戏档有自己的 GAME_NICE_PEACE，不受此项影响。
AUTO_CRITICAL_NICE=0
# --- 游戏进程自动检测（0.4.14，thread.sh watch / auto 用）---
# GAME_AUTO_DETECT：1=开（默认）。watch 每轮先扫 /proc 看两款游戏
#   的主进程在不在跑，不只看前台是谁：只认前台时，切出去回 QQ / 装应用
#   一下，前台就换了，0.4.13 会立刻把游戏档切回均衡、回来再切回去
#   （0.4.12 日志：00:27 切 QQ 23 秒就掉了一次档）。在跑就一直占着
#   游戏档、补绑游戏线程，不管前台是谁；主进程没了才按下面宽限切回。
#   改 0 = 回到 0.4.13 的老行为：只认前台。
# GAME_EXIT_GRACE_CYCLES：游戏进程连续几轮找不到才算真退了（0-12，
#   默认 2 轮 ≈ 10 秒，轮长是 AUTO_WATCH_INTERVAL）。游戏自己重启换
#   PID 的空档里不掉档；改 0 = 进程一没就立刻切回。
GAME_AUTO_DETECT=1
GAME_EXIT_GRACE_CYCLES=2

# --- 游戏模式（0.4.15 起只剩一个游戏档，thread.sh auto/watch + apply_sched.sh game 用）---
# 0.4.14 前和平精英 / 无畏契约各有一个特调档（peace / valorant），
# 0.4.15 起合并成一个游戏模式，参数就是原来和平精英那套值（她只玩
# 和平精英；无畏契约也走同一档）。GAME_*_PEACE 这些键名没改——
# 老面板 / 老 APK 调它们照样生效；GAME_*_VALORANT 的键已删。
# GAME_SCHED_ENABLED=1 时，watch / auto 识别到这两款游戏会自动切到
# 游戏模式，退出游戏切回 MODE（默认 balanced）。改 0 则只绑核、不切调度。
GAME_SCHED_ENABLED=1
# 性能和游戏的差距（都在下面写死的值里）：
#   性能：日常最强——升频拉满、降频 5000us、hispeed 90、uclamp
#     top 102 / fg 51、后台上限 512、GPU 不抬、foreground 全核、不绑线程。
#   游戏：性能那套再加——降频留 10000us（高频拿得更久）、hispeed
#     85（更早拉高频）、uclamp top 153 / fg 77、后台上限收紧到
#     256、GPU 下限抬到 35%（约 316MHz）、foreground 只放中+大核、
#     再按线程分类绑核（主/游戏线程独占超大核）。
# nice：只动关键线程。游戏是大逃杀长局，散热优先，只给主线程 -5，
# 渲染线程不动 nice。
GAME_NICE_PEACE=-5
# schedutil：升频拉满（up=0），降频留 10000us，和 balanced 一致
# （长局散热优先；性能档是 5000us）。
GAME_SCHEDUTIL_UP_US=0
GAME_SCHEDUTIL_DOWN_US_PEACE=10000
# hispeed_load 越低越早拉高频：游戏 85，比性能档的 90 更早。
GAME_HISPEED_LOAD_PEACE=85
# uclamp（0-1024）：0.4.38 起游戏档只剩 foreground min=77（提速项，
# 诊断已证能写）。top-app min=153 被拒、background max=256 数字写不
# 进去（这台内核 max 只认 'max'），所以这两个键还留着备查、但不再读。
GAME_TOP_APP_UCLAMP_MIN_PEACE=153
GAME_FOREGROUND_UCLAMP_MIN_PEACE=77
GAME_BACKGROUND_UCLAMP_MAX=-1
# GPU min_freq 占 max 的百分比：0=不碰。抬高下限能减少 GPU 升频延迟，
# 代价是发热/耗电上去。游戏 35%（性能档不抬）。
# 0.4.2：从 25% 改到 35%。25% 算出来是 226MHz，低于本机
# GPU 最低 OPP 231MHz，等于没抬（0.4.1 日志里写进去的还是溢出的
# 11MHz）。35% 约 316MHz，真正高于最低 OPP 才起作用；脚本现在先
# 除后乘防溢出，再按 available_frequencies 取整到真实 OPP。
# 只在 devfreq 节点存在且 max_freq 读得到时才写，写不进去就跳过。
GAME_GPU_MIN_FREQ_PCT_PEACE=35

# --- 检测到游戏自动清理后台（0.4.16，thread.sh watch / auto 用）---
# GAME_CLEAN_BACKGROUND：1=开（默认）。watch 发现游戏进程刚跑起来
# （新开一局）时清一次后台，换 PID 只是游戏自己重启，不重复清；
# 手动 thread.sh auto 撞见游戏也清一次。GAME_SCHED_ENABLED=0 时
# 不影响清理（清理和切调度是两回事）。
# 只清 cached 应用：oom_score_adj >= 900，也就是系统已经把它扔到
# 后台缓存里、没人正在用的；前台应用和正在放音乐的应用 oom 都低，
# 不会误杀。清法是 am force-stop 整个包，下次打开自动重起。
# 系统应用一律不动（0.4.16 的教训：uid >= 10000 拦不住系统应用，
# Play 商店、权限控制器、闹钟、日历这些系统应用的 uid 也在 10000
# 以上，真机一次清了 37 个；0.4.17 起用 pm list packages -s 取
# 系统包名单，命中就跳过，没 pm 时用厂商前缀兜底）。
# GAME_CLEAN_WHITELIST：空格分隔的包名子串，命中就不清。默认留着
# 音乐四款（汽水/酷狗/QQ音乐/网易云，边打游戏边听歌不能杀）、输入法
# （"inputmethod" 子串，讯飞搜狗都含它；百度输入法是 com.baidu.input，
# 另写一条）、GlassMic/MusicMic（队友听的音乐就靠它们）、启动器、
# 闹钟（alarmclock/deskclock，force-stop 会取消设好的闹钟）、CZero
# 清理应用 com.web.czero（她 2026-11-16 06:17 发截图认的，Android 缓存
# 垃圾清理方案，自己也带后台压制；进游戏时它正好闲置在后台被清了，
# 加进白名单）。QQ/微信没在白名单里：进游戏时会一起清掉，想留就把
# com.tencent.mobileqq / com.tencent.mm 加进来。改白名单要重启 watch
# （或等下一局）。
GAME_CLEAN_BACKGROUND=1
GAME_CLEAN_WHITELIST="com.luna.music com.kugou.android com.tencent.qqmusic com.netease.cloudmusic inputmethod com.baidu.input io.mo.glassmic com.nora.musicmic launcher alarmclock deskclock com.web.czero"

# --- 游戏后台保活（0.4.57 起，thread.sh watch 用）---
# GAME_KEEPALIVE：1=开（默认），0=关。下面四件事都受它总控，
# 关了全停；面板不加开关（她不要新控件），改这里就行。
#   ① oom 钉位：游戏模式期间，watch 每轮检查游戏主进程的
#      /proc/<pid>/oom_score_adj，高于 -1000 就写 -1000（最低
#      被杀位），挡系统按内存压力回收（LMK）杀后台游戏。只钉
#      游戏主进程；进程级设置，进程没了自动失效，不用恢复；
#      写失败只记一行 WARN，不刷屏。
#   ② 电池白名单：每局游戏检测到时（每局一次，和自动清理同
#      节奏），对两个游戏包执行 cmd deviceidle whitelist +包名，
#      等于系统设置里的“电池不受限”。常驻不撤销（撤销了下局
#      还得再加，来回折腾没意义）。
#   ③ 被杀取证：watch 发现游戏从“在”变“不在”、且当时还在
#      游戏档（restore 还没跑）时，抓一次 dumpsys activity
#      exit-info（两个游戏包都查），把最近一条退出记录的时间、
#      reason、subreason、description、status 写进诊断日志
#      （[exitinfo] 前缀）。ApplicationExitInfo 是系统给每次
#      进程退出记的原因和来源——LMK 回收、厂商策略强杀、崩溃
#      靠它分清。只在消失那一轮跑一次，不进常规轮询。
#   ④ 后台运行放行（0.4.59）：每局一次（和 ② 同节奏），对两个
#      游戏包断言系统级放行——cmd appops set 两个包的
#      RUN_ANY_IN_BACKGROUND / RUN_IN_BACKGROUND 为 allow、
#      cmd activity set-standby-bucket 拉到 active；cmd 不在
#      时回退 appops / am 裸命令。全过记一行 INFO，单包失败
#      只记一行 WARN，不影响其余三件。起因：2026-11-21 真机
#      抓到游戏切后台 6 秒被厂商策略强杀（③ 记 reason=13），
#      ①② 挡不住，这层是系统层能做的最后一招。
# 边界说清：①②挡的是内存回收和电池策略；④ 是把系统级放行
# 信号断言到位、降低被厂商策略强杀的概率，但 ColorOS 后台
# 管理真要 force-stop 仍拦不住，主力解法是系统设置里给游戏
# 开电池不受限 + 完全后台行为 + 最近任务锁定；被杀仍靠 ③
# 留证据确认。
GAME_KEEPALIVE=1

# --- zram 内存压缩（0.4.23，zram.sh 用）---
# ZRAM_ALGO：压缩算法，空=不动（保持系统默认）。面板只显示设备上
# 真正有的算法（读 /sys/block/zram0/comp_algorithm），一般有 lz4，
# zstd 得看内核编没编；改算法要先 swapoff 再 reset，脚本会先查空闲
# 内存够不够把已换出的数据搬回来，不够就拒绝。
# ZRAM_SIZE_GB：zram 大小（GB 整数，1-32），空=不动。改大小同样要
# swapoff+reset。开机由 service.sh 按这里的值套用一次；面板里点了
# “应用”会立即切换并把值写到这里。
ZRAM_ALGO=
ZRAM_SIZE_GB=

# --- 去温控（0.4.29，Extreme GT 4.2.1 合并进来）---
# THERMAL_REMOVE：0=关（默认），1=开。开的时候：
#   开机早期（post-fs-data.sh）把 thermal/ 下 9 个替换文件 bind-mount
#   到原位置，盖掉 OPlus 的温控/锁帧配置（sys_thermal_config、
#   sys_high_temp_protect、sys_thermal_control_config、thermallevel_to_fps
#   全 144、充电温控、刷新率配置）；开机后（service.sh）再把各
#   thermal_zone 的 emul_temp 写死 29.5°C、外壳 33°C、关 horae。
#   效果：去锁帧、不降频。代价：机器更烫、电池老得快，只在打游戏时开
#   着、平时关掉最稳妥。关掉后重启一次就完全恢复原厂温控。
#   面板里有个“去温控”开关，点了立即伪装温度，配置替换重启后完全生效。
#   这 9 个文件是 SCENE 按这台机型（项目号 23926）生成的，只对 OPD2404 有效。
# THERMAL_AUTO_GAME：1=进游戏自动开去温控、退游戏自动关（默认，0.4.30）；
#   只在手动开关 THERMAL_REMOVE=0 时起作用，手动开着就是一直开，自动逻辑不动它。
THERMAL_REMOVE=0
THERMAL_AUTO_GAME=1

# --- 一加互传常开（已退役，0.4.47）---
# OSHARE_ALWAYS_ON：0.4.40-0.4.44 的 watch am 补开开关，真机证伪
#   （自动关后 am 起不来服务）。0.4.47 退役：面板开关、watch 补开、
#   互传日志分类都删了，这个键从此没代码读它，留在文件里只是不删
#   已有配置（配置只新增、不删的规矩）。互传常开现在走 LSPosed
#   hook（模块“互传常开”，0.4.46 起），跟这个键无关。
OSHARE_ALWAYS_ON=0

# --- 游戏 Vulkan（0.4.54，已退役，0.4.56）---
# VULKAN_GAME：0.4.54/0.4.55 的“给游戏开 ANGLE”开关。她纠正说
#   要的是全开/全局、不是给游戏开，0.4.56 整体改成下面的
#   VULKAN_GLOBAL。这个键从此没代码读它，留在文件里只是不删
#   已有配置（配置只新增、不删的规矩，同 OSHARE_ALWAYS_ON）。
#   旧 ANGLE 的两个 Settings.Global 键（angle_gl_driver_
#   selection_pkgs / _values）由 vulkan.sh 在 on/off 时顺手
#   删掉，不留残留。
VULKAN_GAME=0

# --- 全局 Vulkan（0.4.56，vulkan.sh 用）---
# VULKAN_GLOBAL：0=关（默认），1=开。开 = 系统界面（HWUI）渲染
#   走 Vulkan：vulkan.sh 把 debug.hwui.renderer=skiavk 写进模块
#   根目录的 system.prop（管理器开机自动加载），并 resetprop
#   立即改当前属性——新启动的应用先生效，SystemUI 等已运行的
#   要重启才完全生效。关 = 删 system.prop 里那行 + resetprop
#   --delete 删当前属性。游戏内部用不用 Vulkan 由游戏自己
#   决定，这个开关管的是系统界面，别指望它改游戏。
VULKAN_GLOBAL=0
